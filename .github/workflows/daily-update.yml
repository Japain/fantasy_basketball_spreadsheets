name: Daily Fantasy Basketball Update

on:
  schedule:
    # Runs at 11:00 AM UTC daily (6:00 AM EST, 3:00 AM PST)
    # Adjust the cron schedule as needed for your timezone
    - cron: '0 11 * * *'
  workflow_dispatch: # Allow manual trigger from GitHub Actions UI

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install uv
        run: curl -LsSf https://astral.sh/uv/install.sh | sh

      - name: Add uv to PATH
        run: echo "$HOME/.local/bin" >> $GITHUB_PATH

      - name: Install dependencies
        run: uv sync

      - name: Set up Google credentials
        env:
          GOOGLE_CREDENTIALS_JSON: ${{ secrets.GOOGLE_CREDENTIALS_JSON }}
        run: |
          mkdir -p credentials
          echo "$GOOGLE_CREDENTIALS_JSON" > credentials/client_secret.json

      - name: Set up Google token
        env:
          GOOGLE_TOKEN_PICKLE_BASE64: ${{ secrets.GOOGLE_TOKEN_PICKLE_BASE64 }}
        run: |
          if [ -n "$GOOGLE_TOKEN_PICKLE_BASE64" ]; then
            echo "$GOOGLE_TOKEN_PICKLE_BASE64" | base64 -d > credentials/google_token.pickle
          fi

      - name: Create .env file
        env:
          YAHOO_CONSUMER_KEY: ${{ secrets.YAHOO_CONSUMER_KEY }}
          YAHOO_CONSUMER_SECRET: ${{ secrets.YAHOO_CONSUMER_SECRET }}
          YAHOO_ACCESS_TOKEN: ${{ secrets.YAHOO_ACCESS_TOKEN }}
          YAHOO_REFRESH_TOKEN: ${{ secrets.YAHOO_REFRESH_TOKEN }}
          YAHOO_TOKEN_TIME: ${{ secrets.YAHOO_TOKEN_TIME }}
          NBA_LEAGUE_ID: ${{ secrets.NBA_LEAGUE_ID }}
          NBA_GAME_ID: ${{ secrets.NBA_GAME_ID }}
          INITIAL_AUCTION_BUDGET: ${{ secrets.INITIAL_AUCTION_BUDGET }}
          GOOGLE_CREDENTIALS_PATH: credentials/client_secret.json
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          DISCORD_ALERT_ROLE_ID: ${{ secrets.DISCORD_ALERT_ROLE_ID }}
        run: |
          # Create YAHOO_ACCESS_TOKEN_JSON as a JSON string
          YAHOO_ACCESS_TOKEN_JSON=$(cat <<EOF
          {"access_token":"$YAHOO_ACCESS_TOKEN","consumer_key":"$YAHOO_CONSUMER_KEY","consumer_secret":"$YAHOO_CONSUMER_SECRET","guid":null,"refresh_token":"$YAHOO_REFRESH_TOKEN","token_time":$YAHOO_TOKEN_TIME,"token_type":"bearer"}
          EOF
          )

          cat > .env << EOF
          YAHOO_CONSUMER_KEY=$YAHOO_CONSUMER_KEY
          YAHOO_CONSUMER_SECRET=$YAHOO_CONSUMER_SECRET
          YAHOO_ACCESS_TOKEN_JSON=$YAHOO_ACCESS_TOKEN_JSON
          NBA_LEAGUE_ID=$NBA_LEAGUE_ID
          NBA_GAME_ID=$NBA_GAME_ID
          INITIAL_AUCTION_BUDGET=$INITIAL_AUCTION_BUDGET
          GOOGLE_CREDENTIALS_PATH=$GOOGLE_CREDENTIALS_PATH
          DISCORD_WEBHOOK_URL=$DISCORD_WEBHOOK_URL
          DISCORD_ALERT_ROLE_ID=$DISCORD_ALERT_ROLE_ID
          GAME_CODE=nba
          EOF

      - name: Run update
        env:
          SPREADSHEET_ID: ${{ secrets.SPREADSHEET_ID }}
        run: |
          uv run python main.py --spreadsheet-id "$SPREADSHEET_ID" --verbose

      - name: Send Discord error notification (fallback)
        if: failure()
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          DISCORD_ALERT_ROLE_ID: ${{ secrets.DISCORD_ALERT_ROLE_ID }}
        run: |
          # Only send if webhook URL is configured
          if [ -n "$DISCORD_WEBHOOK_URL" ]; then
            # Format role mention
            ROLE_MENTION=""
            if [ -n "$DISCORD_ALERT_ROLE_ID" ]; then
              ROLE_MENTION="<@&${DISCORD_ALERT_ROLE_ID}> "
            fi

            # Send error notification via curl
            curl -X POST "$DISCORD_WEBHOOK_URL" \
              -H "Content-Type: application/json" \
              -d "{
                \"content\": \"${ROLE_MENTION}🚨 **Fantasy Basketball Update Failed**\",
                \"embeds\": [{
                  \"title\": \"GitHub Actions Workflow Failed\",
                  \"description\": \"The automated update workflow encountered an error.\",
                  \"color\": 16711680,
                  \"fields\": [
                    {
                      \"name\": \"Workflow\",
                      \"value\": \"${{ github.workflow }}\"
                    },
                    {
                      \"name\": \"Repository\",
                      \"value\": \"${{ github.repository }}\"
                    },
                    {
                      \"name\": \"📋 Action Required\",
                      \"value\": \"[View Workflow Logs](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})\"
                    }
                  ],
                  \"timestamp\": \"$(date -u +%Y-%m-%dT%H:%M:%S.000Z)\"
                }]
              }"
          fi

      - name: Upload logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: error-logs
          path: |
            *.log
            league_data/
          retention-days: 7
